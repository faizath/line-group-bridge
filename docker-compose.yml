services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080" # Public webhook and media
      - "127.0.0.1:8081:8081" # Internal admin API and metrics
    environment:
      ROLE: all
      PORT: "8080"
      ADMIN_PORT: "8081"
      DATABASE_URL: postgres://lgb:lgb_password@postgres:5432/lgb
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_ACCESS_TOKEN: ${LINE_ACCESS_TOKEN:-}
      LINE_TOKEN_MODE: ${LINE_TOKEN_MODE:-long_lived}
      MEDIA_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lgb-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://bridge.example.com}
      OPERATOR_USER_IDS: ${OPERATOR_USER_IDS:-}
      ADMIN_API_TOKENS: ${ADMIN_API_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lgb
      POSTGRES_PASSWORD: lgb_password
      POSTGRES_DB: lgb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgb"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
